stages:
  validate:
    cmd: python -m src.validation.data_validation
    deps:
      - data/raw/loan_data.csv
      - src/validation/data_validation.py

  prepare:
    cmd: python -m src.transformation.data_transformation
    deps:
      - data/raw/loan_data.csv
      - src/transformation/data_transformation.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.training.mlflow_tracking
    deps:
      - data/raw/loan_data.csv
      - src/transformation/data_transformation.py
      - src/training/model_training.py
      - src/training/mlflow_tracking.py
    outs:
      - models/loan_approval_model.joblib:
          cache: false
